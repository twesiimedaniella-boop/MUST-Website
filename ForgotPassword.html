<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MUST</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <header>
        <h1>Mbarara University of Science and Technology</h1>
        <p>Learn • Grow • Build Your Future</p>
    </header>

    <div class="container">

        <div class="welcome">
            <h2>Forgot Your Password?</h2>
            <p>Don't worry!</p>
            <p>Enter your registered email address to begin the password recovery process.</p>
        </div>

        <div class="form-box">

            <h2>Reset Password</h2>

            <p>Enter your registered email address below.</p>

            <form id="forgotForm">

                <label for="email">Email Address</label>

                <input type="email" id="email"
                       placeholder="Enter your email address" required>

                <button type="submit">Submit</button>

            </form>

            <p class="register-link">
                Remember your password?
                <a href="Login.html">Back to Login</a>
            </p>

        </div>

    </div>

    <script>
        document.getElementById("forgotForm").addEventListener("submit",
            function(event) {

                event.preventDefault();

                alert("Password recovery request submitted!");

            }
        );
    </script>

</body>
</html>
