
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="must-logo.png" alt="MUST Logo" class="logo">
        <h1>Mbarara University of Science and Technology</h1>
        <p>Learn • Grow • Build Your Future</p>
    </header>

    <div class="container">

        <div class="welcome">
            <h2>Join Our Institution</h2>
            <p>Start your learning journey with us.</p>
            <p>Create your account to get started.</p>
        </div>

        <div class="form-box">
            <h2>Create an Account</h2>
            <p>Fill in your details below.</p>

            <form id="registerForm">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname"
                       placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Example: student@gmail.com" required>

                <label for="studentId">Student ID</label>
                <input type="text" id="studentId"
                       placeholder="Example: 2026/Bse/001" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm your password" required>

                <button type="submit">Create Account</button>

            </form>

            <p class="register-link">
                Already have an account?
                <a href="login.html">Back to Login</a>
            </p>

        </div>

    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit",
            function(event) {
                event.preventDefault();

                const password = document.getElementById("password").value;
                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password !== confirmPassword) {
                    alert("Passwords do not match!");
                    return;
                }

                alert("Registration form submitted successfully!");

            }
        );
    </script>

</body>
</html>
